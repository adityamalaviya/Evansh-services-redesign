name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c304028f5780d522475510286fc7a4a29b09b9d0 # v3.3.0

      # ── Pipeline (FastAPI) ──────────────────────────────────────────────
      - name: Build & push pipeline
        uses: docker/build-push-action@2cdde995de119a40fb0e2e21364403160e1d206a # v5.3.0
        with:
          context: ./pipeline
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/evansh-pipeline:latest
            ghcr.io/${{ github.repository_owner }}/evansh-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── BFF (Node/Hono) ────────────────────────────────────────────────
      - name: Build & push bff
        uses: docker/build-push-action@2cdde995de119a40fb0e2e21364403160e1d206a # v5.3.0
        with:
          context: ./bff
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/evansh-bff:latest
            ghcr.io/${{ github.repository_owner }}/evansh-bff:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
