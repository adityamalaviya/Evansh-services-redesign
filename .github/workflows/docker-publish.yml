name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lowercase image owner
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b72836531952e4f00199e4ca20141fefbcfab983 # v3.10.0

      # ── Pipeline (FastAPI) ──────────────────────────────────────────────
      - name: Build & push pipeline
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./pipeline
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/evansh-pipeline:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/evansh-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── BFF (Node/Hono) ────────────────────────────────────────────────
      - name: Build & push bff
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./bff
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/evansh-bff:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/evansh-bff:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
