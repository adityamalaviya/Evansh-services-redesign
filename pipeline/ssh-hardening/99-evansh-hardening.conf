# /etc/ssh/sshd_config.d/99-evansh-hardening.conf
# Evansh Services - Production & Staging Hardened OpenSSH Configuration
# ponytail: minimal, native OpenSSH drop-in directives adhering to Mozilla Modern / CIS Benchmark

# A. Authentication Controls
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PermitEmptyPasswords no
KbdInteractiveAuthentication no
UsePAM yes
MaxAuthTries 3
LoginGraceTime 30

# B. Protocol & Cipher Hardening (Modern Cryptographic Standards)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp521,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# C. Session & Connection Limits
ClientAliveInterval 300
ClientAliveCountMax 2
MaxSessions 3
MaxStartups 10:30:60
TCPKeepAlive no

# D. Access Restriction & Forwarding Controls
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no

# E. Logging & Audit Trail
LogLevel VERBOSE
SyslogFacility AUTH
