version: "3.9"

# Use this file to pull pre-built images from GHCR instead of building locally.
# Usage: docker compose -f docker-compose.ghcr.yml up -d

services:
  bff:
    image: ghcr.io/adityamalaviya/evansh-bff:latest
    ports:
      - "3001:3001"
    env_file:
      - ./bff/.env
    environment:
      - NODE_ENV=production
