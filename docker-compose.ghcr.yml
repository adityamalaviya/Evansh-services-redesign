version: "3.9"

# Use this file to pull pre-built images from GHCR instead of building locally.
# Usage: docker compose -f docker-compose.ghcr.yml up -d

services:
  bff:
    image: ghcr.io/adityamalaviya/evansh-bff:latest
    ports:
      - "3001:3001"
    env_file:
      - ./bff/.env
    environment:
      - NODE_ENV=production
      - PIPELINE_URL=http://pipeline:8000
    depends_on:
      pipeline:
        condition: service_healthy
    networks:
      - internal

  pipeline:
    image: ghcr.io/adityamalaviya/evansh-pipeline:latest
    ports:
      - "8000:8000"
    env_file:
      - ./pipeline/.env
      - ./bff/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    driver: bridge
